# Limine prints a banner and a progress line before handing over, which
# is the first thing anyone sees of this system and is not part of it.
# quiet suppresses that; timeout 0 skips the menu it would otherwise
# draw first.
timeout: 0
quiet: yes

/Vextro 9
    protocol: limine
    kernel_path: boot():/boot/kernel
    module_path: boot():/boot/initrd.tar
    resolution: 1280x800x32
